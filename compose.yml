services:
  postgres:
    image: 'postgres:latest'
    environment:
      - POSTGRES_DB=curso_springboot
      - POSTGRES_USER=devdb
      - POSTGRES_PASSWORD=a1b2c3d4
    ports:
      - '5435:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  programa-service:
    image: 'dcrilop/programa-service:latest'
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/curso_springboot
      DB_USERNAME: devdb
      DB_PASSWORD: a1b2c3d4
    profiles:
      - app

volumes:
  postgres-data:
